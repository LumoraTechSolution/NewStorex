server:
  address: 0.0.0.0
  port: 8082
  tomcat:
    # A rejected upload must still come back as its 422 (M5-06). Tomcat swallows only 2 MB of an
    # unread request body by default and then resets the connection, which a till reads as a
    # network failure - so a backup with a permanently bad header would be retried forever rather
    # than once. Draining the body costs a few seconds of one connection and buys a real answer.
    max-swallow-size: -1

spring:
  datasource:
    url: ${CLOUD_DATABASE_URL:jdbc:postgresql://127.0.0.1:5443/lumora_cloud}
    username: ${CLOUD_DATABASE_USER:lumora}
    password: ${CLOUD_DB_PASSWORD:lumora}
    hikari:
      # Twenty is right for a dedicated database and wrong for a free-tier one,
      # where a large idle pool holds a serverless compute awake. The deployed
      # value is 5 (see DEPLOYMENT.md). Overridable rather than lowered outright
      # because the ceiling belongs to the environment, not the code — and the
      # desktop profile sets its own 8 and never reads this.
      maximum-pool-size: ${CLOUD_DB_POOL_SIZE:20}
      pool-name: lumora-cloud

  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/cloud

lumora:
  console:
    # Which origins may read this API from a browser. An explicit list, never a wildcard: this
    # endpoint answers with a shop's takings. The production value is the console's Vercel domain
    # and is set from the environment (M4-10).
    allowed-origins: ${LUMORA_CONSOLE_ORIGINS:http://localhost:3001,http://127.0.0.1:3001}
    # How long an owner stays signed in. Longer than the till's fifteen minutes on purpose — see
    # the V208 header: a phone in a pocket is not a shared screen on a shop floor.
    session-ttl: ${LUMORA_CONSOLE_SESSION_TTL:P7D}

  platform:
    # Lumora staff sessions (M4-08). Eight hours against the owner's seven days, deliberately: a
    # console session leaks one shop's takings, a platform session can suspend every shop on the
    # system. A working day is long enough not to interrupt anyone and short enough that a laptop
    # left somewhere is not a standing key.
    session-ttl: ${LUMORA_PLATFORM_SESSION_TTL:PT8H}
    # Creates the first platform admin, once, on a database that has none — everything in M4-08 is
    # done by an admin, including making admins, so something outside that loop has to start it.
    # The generated password is logged once at startup and stored only as a BCrypt hash. Setting
    # this again later does nothing: the guard is an empty table, not an absent setting, so leaving
    # it in an environment file is not a standing back door. See PlatformBootstrap.
    bootstrap-email: ${LUMORA_PLATFORM_BOOTSTRAP_EMAIL:}
    bootstrap-name: ${LUMORA_PLATFORM_BOOTSTRAP_NAME:Lumora}

  backup:
    # Off-site copies of a shop's whole database (M5-06). Cloudflare R2 in production: 10 GB free,
    # no egress charge, and the S3 API so the deployment is not soldered to one vendor.
    #
    # Leaving these unset is legal and logs a warning at startup rather than failing, because the
    # test suite and a developer's laptop both want the filesystem store. On the deployed host that
    # warning is the difference between a backup and the appearance of one — the container's disk
    # is recreated on every release.
    s3:
      bucket: ${LUMORA_BACKUP_S3_BUCKET:}
      endpoint: ${LUMORA_BACKUP_S3_ENDPOINT:}
      # R2 has no regions in the AWS sense and still requires the signature to name one.
      region: ${LUMORA_BACKUP_S3_REGION:auto}
      access-key-id: ${LUMORA_BACKUP_S3_ACCESS_KEY_ID:}
      secret-access-key: ${LUMORA_BACKUP_S3_SECRET_ACCESS_KEY:}
    directory: ${LUMORA_CLOUD_BACKUP_DIR:./cloud-backups}
    # 512 MB. A shop's compressed dump is single-digit megabytes in its first year; this is the
    # ceiling on what one request may spend of somebody else's storage, not an expectation.
    max-bytes: ${LUMORA_BACKUP_MAX_BYTES:536870912}
    # A week of twice-daily uploads. Deep enough to survive a corruption nobody noticed for days,
    # shallow enough that a hundred shops is a bill somebody can look at.
    keep-per-tenant: ${LUMORA_BACKUP_KEEP:14}
