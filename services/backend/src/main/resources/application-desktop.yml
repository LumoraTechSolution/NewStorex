server:
  # Loopback only, deliberately. In v1 the till's API is not reachable from the LAN;
  # LAN multi-terminal is a v2 feature and will be an explicit decision, not an
  # accident of a default bind address.
  address: 127.0.0.1
  port: 8081

spring:
  datasource:
    url: ${LOCAL_DATABASE_URL:jdbc:postgresql://127.0.0.1:5442/lumora_local}
    username: ${LOCAL_DATABASE_USER:lumora}
    password: ${LOCAL_DB_PASSWORD:lumora}
    hikari:
      # A single till. A large pool buys nothing and slows startup, which the
      # cashier waits on every morning.
      maximum-pool-size: 8
      pool-name: lumora-local

  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/desktop

lumora:
  sync:
    enabled: true
    cloud-url: ${LUMORA_CLOUD_URL:http://127.0.0.1:8082}
    # The tenant API token this till presents to the cloud (M4-01). Empty until the shop is
    # activated: M5-03's first-run wizard provisions it, and until then the outbox simply
    # queues rather than pushing as nobody. Deliberately has no default — a shipped default
    # would be the same credential on every till that ever installs this build.
    token: ${LUMORA_CLOUD_TOKEN:}
    # ISO-8601 because @Scheduled reads these two directly and only parses that form.
    # Ten seconds, not milliseconds: nothing in the shop waits on this, and a busy loop
    # against an unreachable cloud helps nobody.
    interval: PT10S
    initial-delay: PT15S
    batch-size: 100
    request-timeout: 15s
    backoff-base: 5s
    # Capped, so a till that recovers at 3am syncs by 3:05 rather than at the far end of
    # an unbounded exponential.
    backoff-max: 5m
    # How often the downward pull actually reaches the cloud (M4-09). Much longer than the drain
    # above, because the two differ in urgency: an unsent sale should leave within seconds, a
    # licence that runs out at noon can be noticed at five past. The tick is still every ten
    # seconds; this is the rate limit inside it.
    entitlement-interval: 5m
