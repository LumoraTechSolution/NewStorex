spring:
  application:
    name: lumora-backend

  # Neither profile is a safe default to guess wrong, but desktop is the one a developer
  # almost always wants, and it binds to loopback only - so guessing it is harmless.
  profiles:
    default: desktop

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate is only ever allowed to check it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # The desktop and cloud databases diverge, so each profile supplies its own
    # locations on top of common. Missing directories are not an error - a profile
    # legitimately has no migrations of its own yet.
    fail-on-missing-locations: false

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Status only, no per-component detail. `/actuator/**` deliberately sits outside
      # TenantAuthFilter's `/api/*` pattern so a load balancer — and the keep-warm cron in
      # DEPLOYMENT.md — can reach it without holding a shop's key. That makes it the one
      # unauthenticated path on the cloud, and `always` was answering it with the state of
      # every component, the database included, to anybody who asked.
      #
      # Nothing that reads this endpoint needs more than UP or DOWN: the cron wants a 200,
      # Render's readiness probe wants a 200, and a person diagnosing a real outage has the
      # logs. `when-authorized` would be the wrong knob here rather than a stricter one —
      # there is no Spring Security context on this service to authorize against, so it
      # would degrade to this same answer while implying a check that does not exist.
      show-details: never

logging:
  level:
    org.flywaydb: INFO
